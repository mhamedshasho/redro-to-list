name: Android APK - Phone Manager

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "phone-numbers-manager/**"
      - ".github/workflows/android-phone-manager.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android packaging tools
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets sharp
      - name: Prepare Phone Manager web app
        run: |
          mkdir -p www resources
          cp -a phone-numbers-manager/. www/
          node --input-type=module -e '
            import sharp from "sharp";
            await sharp("phone-numbers-manager/icons/icon.svg").resize(1024,1024,{fit:"contain",background:{r:17,g:19,b:24,alpha:1}}).png().toFile("resources/icon.png");
          '
      - name: Initialize Android project
        run: |
          npx cap init "Redro Phone Manager" "com.redro.phonemanager" --web-dir=www
          rm -rf android
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: redro-phone-manager-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
